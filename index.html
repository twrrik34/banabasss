<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>banabasss</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: #02030a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Uzay yıldızları */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        /* Ana buton */
        .click-button {
            position: relative;
            width: 360px;
            height: 180px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(
                to bottom,
                #ff3b3b,
                #d40000
            );

            color: white;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 18px 0 #8b0000,
                0 25px 35px rgba(0, 0, 0, 0.6);

            transition:
                transform 0.08s ease,
                box-shadow 0.08s ease;
        }

        /* Basınca buton aşağı çöker */
        .click-button:active {
            transform: translateY(18px);

            box-shadow:
                0 0 0 #8b0000,
                0 8px 20px rgba(0, 0, 0, 0.5);
        }

        /* Hafif parlama */
        .click-button::before {
            content: "";
            position: absolute;

            top: 10px;
            left: 12px;
            right: 12px;
            height: 35px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.18);

            pointer-events: none;
        }

        /* Telefonda biraz küçült */
        @media (max-width: 600px) {
            .click-button {
                width: 280px;
                height: 150px;
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <button class="click-button">
        CLICK ME
    </button>

    <script>
        const starsContainer = document.querySelector(".stars");

        // 150 adet küçük yuvarlak yıldız oluştur
        for (let i = 0; i < 150; i++) {
            const star = document.createElement("div");

            star.classList.add("star");

            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";

            const size = Math.random() * 3 + 1;

            star.style.width = size + "px";
            star.style.height = size + "px";

            starsContainer.appendChild(star);
        }
    </script>

</body>
</html>
