<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>banabasss</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: #02030a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* =========================
           UZAY YILDIZLARI
        ========================= */

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        /* =========================
           ANA İÇERİK
        ========================= */

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .counter {
            color: white;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
        }

        /* =========================
           ANA BUTON
        ========================= */

        .click-button {
            position: relative;

            width: 360px;
            height: 180px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(
                to bottom,
                #ff3b3b,
                #d40000
            );

            color: white;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 18px 0 #8b0000,
                0 25px 35px rgba(0, 0, 0, 0.6);

            transition:
                transform 0.08s ease,
                box-shadow 0.08s ease;
        }

        .click-button:active {
            transform: translateY(18px);

            box-shadow:
                0 0 0 #8b0000,
                0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .click-button::before {
            content: "";

            position: absolute;

            top: 10px;
            left: 12px;
            right: 12px;
            height: 35px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.18);

            pointer-events: none;
        }

        /* =========================
           GİRİŞ EKRANI
        ========================= */

        .login-overlay {
            position: fixed;
            inset: 0;

            z-index: 10;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);

            transition: opacity 0.35s ease;
        }

        .login-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .login-box {
            width: min(90%, 390px);

            padding: 38px 30px;

            border-radius: 24px;

            background: rgba(15, 17, 30, 0.92);

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.65),
                inset 0 0 30px rgba(255, 255, 255, 0.025);

            text-align: center;

            color: white;
        }

        .login-title {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #aaa;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .google-button,
        .guest-button {
            width: 100%;
            height: 52px;

            border-radius: 12px;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .google-button:hover,
        .guest-button:hover {
            transform: translateY(-2px);
        }

        .google-button {
            border: none;

            background: white;
            color: #222;
        }

        .guest-button {
            margin-top: 12px;

            background: transparent;
            color: white;

            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .guest-button:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .login-status {
            min-height: 20px;
            margin-top: 18px;

            color: #aaa;
            font-size: 13px;
        }

        /* =========================
           KULLANICI BİLGİSİ
        ========================= */

        .user-info {
            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 5;

            color: white;

            padding: 9px 14px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.1);

            font-size: 13px;
        }

        /* =========================
           TELEFON
        ========================= */

        @media (max-width: 600px) {

            .click-button {
                width: 280px;
                height: 150px;
                font-size: 34px;
            }

            .counter {
                font-size: 22px;
            }

            .login-box {
                padding: 32px 22px;
            }

            .login-title {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         YILDIZLAR
    ========================= -->

    <div class="stars"></div>


    <!-- =========================
         ANA OYUN
    ========================= -->

    <div class="container">

        <div class="counter">
            0 CLICKS
        </div>

        <button class="click-button">
            CLICK ME
        </button>

    </div>


    <!-- =========================
         KULLANICI BİLGİSİ
    ========================= -->

    <div class="user-info" id="userInfo">
        Guest
    </div>


    <!-- =========================
         GİRİŞ PANELİ
    ========================= -->

    <div class="login-overlay" id="loginOverlay">

        <div class="login-box">

            <div class="login-title">
                BANABASSS
            </div>

            <div class="login-subtitle">
                Ready to click?
            </div>

            <button
                class="google-button"
                id="googleButton"
            >
                🔵 Continue with Google
            </button>

            <button
                class="guest-button"
                id="guestButton"
            >
                👻 Continue as Guest
            </button>

            <div
                class="login-status"
                id="loginStatus"
            ></div>

        </div>

    </div>


    <script>

        /* =========================
           SUPABASE AYARLARI
        ========================= */

        const SUPABASE_URL =
            "https://usvrsrodbivsjrxityzb.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_QUghnr59x4oH65LZqQW5zg_7qR7yMr4";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================
           YILDIZLARI OLUŞTUR
        ========================= */

        const starsContainer =
            document.querySelector(".stars");

        for (let i = 0; i < 150; i++) {

            const star =
                document.createElement("div");

            star.classList.add("star");

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            const size =
                Math.random() * 3 + 1;

            star.style.width =
                size + "px";

            star.style.height =
                size + "px";

            starsContainer.appendChild(star);
        }


        /* =========================
           ELEMENTLER
        ========================= */

        const button =
            document.querySelector(".click-button");

        const counter =
            document.querySelector(".counter");

        const loginOverlay =
            document.getElementById("loginOverlay");

        const googleButton =
            document.getElementById("googleButton");

        const guestButton =
            document.getElementById("guestButton");

        const loginStatus =
            document.getElementById("loginStatus");

        const userInfo =
            document.getElementById("userInfo");


        let clicks = 0;

        let currentUser = null;

        let isGuest = false;


        /* =========================
           GOOGLE GİRİŞİ
        ========================= */

        googleButton.addEventListener(
            "click",
            async function () {

                loginStatus.textContent =
                    "Opening Google...";

                const { error } =
                    await supabaseClient.auth.signInWithOAuth({
                        provider: "google",
                        options: {
                            redirectTo:
                                window.location.origin
                        }
                    });

                if (error) {

                    console.error(error);

                    loginStatus.textContent =
                        "Google login failed.";
                }
            }
        );


        /* =========================
           MİSAFİR GİRİŞİ
        ========================= */

        guestButton.addEventListener(
            "click",
            function () {

                isGuest = true;

                userInfo.textContent =
                    "👻 Guest";

                loginOverlay.classList.add(
                    "hidden"
                );
            }
        );


        /* =========================
           KULLANICIYI KONTROL ET
        ========================= */

        async function loadUser() {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient.auth.getUser();


            if (user) {

                currentUser = user;

                isGuest = false;

                const name =
                    user.user_metadata?.full_name ||
                    user.user_metadata?.name ||
                    user.email ||
                    "User";

                userInfo.textContent =
                    "👤 " + name;

                loginOverlay.classList.add(
                    "hidden"
                );

            } else {

                loginOverlay.classList.remove(
                    "hidden"
                );
            }
        }


        /* =========================
           AUTH DEĞİŞİKLİKLERİNİ DİNLE
        ========================= */

        supabaseClient.auth.onAuthStateChange(
            function (event, session) {

                if (session?.user) {

                    currentUser =
                        session.user;

                    isGuest = false;

                    const name =
                        session.user.user_metadata?.full_name ||
                        session.user.user_metadata?.name ||
                        session.user.email ||
                        "User";

                    userInfo.textContent =
                        "👤 " + name;

                    loginOverlay.classList.add(
                        "hidden"
                    );
                }
            }
        );


        /* =========================
           CLICK SAYACI
        ========================= */

        button.addEventListener(
            "click",
            function () {

                clicks++;

                counter.textContent =
                    clicks +
                    (clicks === 1
                        ? " CLICK"
                        : " CLICKS");

            }
        );


        /* =========================
           BAŞLANGIÇ
        ========================= */

        loadUser();

    </script>

</body>
</html>
