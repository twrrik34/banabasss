<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CLICK ME</title>

<link rel="icon" type="image/png" href="logo.png.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #121a38 0%,
            #090e22 32%,
            #030611 68%,
            #010207 100%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   STARS
========================= */

.stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    top: -30px;
    background: white;
    border-radius: 50%;

    animation:
        starFall
        linear
        infinite;

    will-change: transform;
}

.star.tiny {
    width: 1px;
    height: 1px;
    opacity: .45;

    box-shadow:
        0 0 3px
        rgba(255,255,255,.5);
}

.star.normal {
    width: 2px;
    height: 2px;
    opacity: .75;

    box-shadow:
        0 0 7px
        rgba(255,255,255,.8);
}

.star.bright {
    width: 3px;
    height: 3px;
    opacity: 1;

    box-shadow:
        0 0 12px
        rgba(255,255,255,1);
}

.star.cross {
    width: 3px;
    height: 3px;

    box-shadow:
        0 0 5px white,
        0 -8px 7px rgba(255,255,255,.7),
        0 8px 7px rgba(255,255,255,.7),
        -8px 0 7px rgba(255,255,255,.7),
        8px 0 7px rgba(255,255,255,.7);
}

.star.diamond {
    width: 5px;
    height: 5px;

    border-radius: 0;

    transform: rotate(45deg);

    box-shadow:
        0 0 12px
        rgba(255,255,255,1);
}

.star.glow {
    width: 4px;
    height: 4px;

    box-shadow:
        0 0 6px white,
        0 0 14px white,
        0 0 26px
        rgba(255,255,255,.8);
}

@keyframes starFall {

    from {
        transform:
            translate3d(
                0,
                -15vh,
                0
            );
    }

    to {
        transform:
            translate3d(
                0,
                115vh,
                0
            );
    }

}


/* =========================
   TOP BAR
========================= */

.top-bar {
    position: fixed;

    top: 18px;
    left: 18px;
    right: 18px;

    z-index: 10;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


/* =========================
   STREAK
========================= */

.streak {
    display: flex;

    align-items: center;

    gap: 7px;

    padding: 9px 14px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size: 14px;

    font-weight: 700;

    text-shadow:
        0 0 8px
        rgba(255,255,255,.25);
}


/* =========================
   USER
========================= */

.user-info {
    padding: 10px 15px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size: 14px;

    cursor: pointer;

    user-select: none;
}


/* =========================
   TODAY'S WINNER
========================= */

.today-winner {
    position: fixed;

    top: 24px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 15;

    min-height: 55px;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    pointer-events: none;

    white-space: nowrap;
}

.today-title {
    font-size: 10px;

    letter-spacing: 3px;

    font-weight: 800;

    color:
        rgba(255,255,255,.55);

    margin-bottom: 6px;

    text-transform: uppercase;
}

.winner-name {
    position: relative;

    display: inline-block;

    font-size: 18px;

    font-weight: 900;

    letter-spacing: .5px;

    text-shadow:
        0 0 12px
        rgba(255,255,255,.25);

    padding-left: 9px;
}

.winner-crown {
    position: absolute;

    left: -17px;
    top: -15px;

    font-size: 16px;

    transform:
        rotate(-17deg);

    filter:
        drop-shadow(
            0 0 5px
            rgba(255,255,255,.35)
        );

    z-index: 2;
}

.winner-clicks {
    font-size: 13px;

    font-weight: 700;

    color:
        rgba(255,255,255,.65);

    margin-top: 2px;
}

.no-winner {
    color:
        rgba(255,255,255,.4);

    font-size: 13px;
}


/* =========================
   MAIN
========================= */

.container {
    position: relative;

    z-index: 2;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 22px;

    padding:
        100px 20px 40px;
}


/* =========================
   COUNTER
========================= */

.counter {
    color: white;

    font-size: 26px;

    font-weight: 700;

    letter-spacing: 2px;

    text-shadow:
        0 0 10px
        rgba(255,255,255,.35);
}


/* =========================
   CLICK BUTTON
========================= */

.click-button {
    position: relative;

    width: 360px;
    height: 180px;

    border: none;

    border-radius: 30px;

    background:
        linear-gradient(
            to bottom,
            #ff3b3b,
            #d40000
        );

    color: white;

    font-size: 42px;

    font-weight: 900;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 18px 0 #8b0000,
        0 25px 35px
        rgba(0,0,0,.6);

    transition:
        transform .08s ease,
        box-shadow .08s ease;

    user-select: none;
}

.click-button:active {
    transform:
        translateY(18px);

    box-shadow:
        0 0 0 #8b0000,
        0 8px 20px
        rgba(0,0,0,.5);
}

.click-button::before {
    content: "";

    position: absolute;

    top: 10px;
    left: 12px;
    right: 12px;

    height: 35px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.18);

    pointer-events: none;
}


/* =========================
   LEADERBOARD BUTTON
========================= */

.leaderboard-button {
    padding: 12px 22px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.07);

    color: white;

    font-weight: 700;

    cursor: pointer;
}


/* =========================
   OVERLAY
========================= */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    opacity: 1;

    transition:
        opacity .25s ease;
}

.overlay.hidden {
    opacity: 0;

    pointer-events: none;
}


/* =========================
   MODAL
========================= */

.modal {
    width:
        min(92%, 420px);

    max-height: 90vh;

    overflow-y: auto;

    padding: 32px 26px;

    border-radius: 24px;

    background:
        rgba(15,17,30,.96);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.7);

    text-align: center;
}

.modal h1 {
    font-size: 30px;

    margin-bottom: 10px;
}

.modal p {
    color: #aaa;

    font-size: 14px;

    margin-bottom: 22px;
}


/* =========================
   INPUT
========================= */

.nickname-input {
    width: 100%;

    height: 52px;

    padding: 0 15px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.06);

    color: white;

    outline: none;

    font-size: 16px;

    text-align: center;
}


/* =========================
   MODAL BUTTONS
========================= */

.primary-button,
.secondary-button,
.google-button,
.guest-button,
.logout-button {
    width: 100%;

    height: 52px;

    margin-top: 12px;

    border-radius: 12px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}

.primary-button {
    border: none;

    background:
        #ff3030;

    color: white;
}

.secondary-button {
    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.05);

    color: white;
}

.google-button {
    border: none;

    background: white;

    color: #222;
}

.guest-button {
    border:
        1px solid
        rgba(255,255,255,.15);

    background: transparent;

    color: white;
}

.logout-button {
    border: none;

    background:
        #b91c1c;

    color: white;
}


/* =========================
   LEADERBOARD
========================= */

.leaderboard-list {
    max-height: 380px;

    overflow-y: auto;

    margin-top: 20px;
}

.leader-row {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 13px 10px;

    margin-bottom: 7px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.05);
}

.rank {
    width: 40px;

    font-weight: 900;
}

.nick {
    flex: 1;

    text-align: left;
}

.score {
    font-weight: 900;
}


/* =========================
   STATUS
========================= */

.status {
    min-height: 20px;

    margin-top: 15px;

    color: #aaa;

    font-size: 13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width: 600px) {

    .top-bar {
        top: 10px;

        left: 10px;
        right: 10px;
    }

    .today-winner {
        top: 60px;
    }

    .streak {
        width: 42px;
        height: 42px;

        padding: 0;

        justify-content: center;

        border-radius: 50%;

        font-size: 16px;
    }

    .streak .streak-text {
        display: none;
    }

    .streak .streak-number {
        font-size: 15px;
    }

    .user-info {
        padding:
            9px 12px;

        font-size: 13px;
    }

    .container {
        padding-top: 110px;

        gap: 18px;
    }

    .today-title {
        font-size: 9px;

        letter-spacing: 2.5px;
    }

    .winner-name {
        font-size: 16px;
    }

    .winner-crown {
        left: -15px;
        top: -13px;

        font-size: 14px;
    }

    .winner-clicks {
        font-size: 12px;
    }

    .counter {
        font-size: 22px;
    }

    .click-button {
        width: 280px;

        height: 150px;

        font-size: 34px;
    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width: 350px) {

    .click-button {
        width: 250px;

        height: 135px;

        font-size: 30px;
    }

}

</style>
</head>


<body>


<!-- STARS -->

<div
    class="stars"
    id="stars"
></div>


<!-- TOP BAR -->

<div class="top-bar">

    <div
        class="streak"

    >

        <span>🔥</span>

        <span
            class="streak-number"

        >
            0
        </span>

            class="streak-text"

            DAY STREAK
        </span>

    </div>


    <div
        class="user-info"
        id="userInfo"
    >
        Guest
    </div>

</div>


<!-- TODAY'S WINNER -->

<div
    class="today-winner"
    id="todayWinner"
>

    <div class="today-title">
        TODAY'S WINNER
    </div>

    <div
        id="winnerContent"
    >

        <div class="no-winner">

        </div>

    </div>

</div>


<!-- MAIN -->

<div class="container">


    <div
        class="counter"
        id="counter"
    >
        0 CLICKS
    </div>


    <button

        id="clickButton"

    </button>

>

        <button

        </button>


        <button

</div>

<div

        </p>


        <input

        >


        <button
            class="primary-button"

    </div>

</div>


<!-- LEADERBOARD -->

<div
    class="overlay hidden"
    id="leaderboardOverlay"
>

    <div class="modal">

        <h1>
            🏆 GLOBAL
        </h1>

        <p>
            Top clickers
        </p>


        <div
            class="leaderboard-list"
            id="leaderboardList"
        ></div>


        <button
            class="secondary-button"
            id="closeLeaderboardButton"
        >
            Close
        </button>

    </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://usvrsrodbivsjrxityzb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_QUghnr59x4oH65LZqQW5zg_7qR7yMr4";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const stars =
    document.getElementById("stars");

const loginOverlay =
    document.getElementById("loginOverlay");

const nicknameOverlay =
    document.getElementById("nicknameOverlay");

const profileOverlay =
    document.getElementById("profileOverlay");

const changeNicknameOverlay =
    document.getElementById("changeNicknameOverlay");

const leaderboardOverlay =
    document.getElementById("leaderboardOverlay");

const googleButton =
    document.getElementById("googleButton");

const guestButton =
    document.getElementById("guestButton");

const clickButton =
    document.getElementById("clickButton");

const counter =
    document.getElementById("counter");

const userInfo =
    document.getElementById("userInfo");

const streakNumber =
    document.getElementById("streakNumber");

const winnerContent =
    document.getElementById("winnerContent");

const nicknameInput =
    document.getElementById("nicknameInput");

const saveNicknameButton =
    document.getElementById("saveNicknameButton");

const leaderboardButton =
    document.getElementById("leaderboardButton");

const leaderboardList =
    document.getElementById("leaderboardList");

const logoutButton =
    document.getElementById("logoutButton");

const profileName =
    document.getElementById("profileName");

const profileNicknameButton =
    document.getElementById("profileNicknameButton");

const closeProfileButton =
    document.getElementById("closeProfileButton");

const changeNicknameInput =
    document.getElementById("changeNicknameInput");

const changeNicknameButton =
    document.getElementById("changeNicknameButton");

const closeNicknameButton =
    document.getElementById("closeNicknameButton");

const closeLeaderboardButton =
    document.getElementById("closeLeaderboardButton");

const loginStatus =
    document.getElementById("loginStatus");

const nicknameStatus =
    document.getElementById("nicknameStatus");

const changeNicknameStatus =
    document.getElementById("changeNicknameStatus");

const cooldownText =
    document.getElementById("cooldownText");


/* =========================
   STATE
========================= */

let currentUser = null;

let isGuest = false;

let clicks = 0;

let currentNickname = null;

let dailyStreak = 0;


/* =========================
   STARS
========================= */

for (
    let i = 0;
    i < 350;
    i++
) {

    const star =
        document.createElement("div");

    star.classList.add("star");

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    const type =
        Math.random();

    if (type < .55) {

        star.classList.add("tiny");

    } else if (type < .82) {

        star.classList.add("normal");

    } else if (type < .90) {

        star.classList.add("bright");

    } else if (type < .95) {

        star.classList.add("cross");

    } else if (type < .98) {

        star.classList.add("diamond");

    } else {

        star.classList.add("glow");

    }

    star.style.animationDuration =
        (
            13 +
            Math.random() * 12
        ) + "s";

    star.style.animationDelay =
        (
            Math.random() * -25
        ) + "s";

    stars.appendChild(star);

}


/* =========================
   HELPERS
========================= */

function show(element) {
    element.classList.remove("hidden");
}

function hide(element) {
    element.classList.add("hidden");
}

function updateCounter() {

    counter.textContent =
        Number(clicks).toLocaleString() +
        (
            clicks === 1
                ? " CLICK"
                : " CLICKS"
        );

}

function updateStreak(value) {

    dailyStreak =
        Number(value) || 0;

    streakNumber.textContent =
        dailyStreak;

}

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* =========================
   TODAY'S WINNER
========================= */

async function loadTodaysWinner() {

    /*
       TODAY'S WINNER =
       YESTERDAY'S DAILY LEADER
    */

    const yesterday =
        new Date();

    yesterday.setDate(
        yesterday.getDate() - 1
    );

    const year =
        yesterday.getFullYear();

    const month =
        String(
            yesterday.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            yesterday.getDate()
        ).padStart(2, "0");

    const yesterdayString =
        `${year}-${month}-${day}`;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("leadboard")
            .select(
                "username, daily_clicks"
            )
            .eq(
                "daily_click_date",
                yesterdayString
            )
            .not(
                "username",
                "is",
                null
            )
            .order(
                "daily_clicks",
                {
                    ascending: false
                }
            )
            .limit(1);


    if (error) {

        console.error(
            "Today's Winner error:",
            error
        );

        winnerContent.innerHTML =
            `
            <div class="no-winner">
                Winner unavailable
            </div>
            `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        winnerContent.innerHTML =
            `
            <div class="no-winner">
                No winner yet
            </div>
            `;

        return;

    }


    const winner =
        data[0];

    const name =
        escapeHtml(
            winner.username
        );

    const score =
        Number(
            winner.daily_clicks || 0
        ).toLocaleString();


    winnerContent.innerHTML =
        `
        <div class="winner-name">

            <span class="winner-crown">
                👑
            </span>

            ${name}

        </div>

        <div class="winner-clicks">
            ${score} CLICKS
        </div>
        `;

}


/* =========================
   DAILY STREAK
========================= */

async function updateDailyStreak() {

    if (!currentUser) {
        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .rpc(
                "update_daily_streak"
            );

    if (error) {

        console.error(
            "Streak error:",
            error
        );

        return;

    }

    if (
        data &&
        data.length
    ) {

        updateStreak(
            data[0].streak
        );

    }

}


/* =========================
   GOOGLE LOGIN
========================= */

googleButton.addEventListener(
    "click",
    async () => {

        loginStatus.textContent =
            "Opening Google...";

        const {
            error
        } =
            await supabaseClient
                .auth
                .signInWithOAuth({

                    provider: "google",

                    options: {

                        redirectTo:
                            window.location.origin

                    }

                });

        if (error) {

            console.error(error);

            loginStatus.textContent =
                error.message;

        }

    }
);


/* =========================
   GUEST
========================= */

guestButton.addEventListener(
    "click",
    () => {

        isGuest = true;

        currentUser = null;

        currentNickname = null;

        clicks = 0;

        updateCounter();

        updateStreak(0);

        userInfo.textContent =
            "👻 Guest";

        hide(loginOverlay);

    }
);


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

    if (!currentUser) {
        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("leadboard")
            .select(
                `
                username,
                clicks,
                daily_streak,
                nickname_changed_at
                `
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


    if (error) {

        console.error(error);

        return;

    }

    if (!data) {

        console.error(
            "Profile not found"
        );

        return;

    }


    currentNickname =
        data.username;

    clicks =
        Number(
            data.clicks || 0
        );

    updateCounter();

    updateStreak(
        data.daily_streak
    );


    if (currentNickname) {

        userInfo.textContent =
            "👤 " +
            currentNickname;

        hide(nicknameOverlay);

    } else {

        show(nicknameOverlay);

        nicknameInput.focus();

    }


    await updateDailyStreak();

}

/* =========================
   CLICK
========================= */

clickButton.addEventListener(

        if (isGuest) {

            clicks++;

            updateCounter();

            return;

        }


        if (!currentUser) {

            show(loginOverlay);

            return;

        }


        const {
            data,
            error
        } =
            await supabaseClient
                .rpc(
                    "increment_clicks"
                );


        if (error) {

            console.error(error);

            return;

        }


        clicks =
            Number(data);

        updateCounter();

    }

/* =========================
   GLOBAL LEADERBOARD
========================= */

leaderboardButton.addEventListener(
    "click",
    async () => {

        show(
            leaderboardOverlay
        );

        leaderboardList.innerHTML =
            "<p>Loading...</p>";


        const {
            data,
            error
        } =
            await supabaseClient
                .from("leadboard")
                .select(
                    "username, clicks"
                )
                .not(
                    "username",
                    "is",
                    null
                )
                .order(
                    "clicks",
                    {
                        ascending: false
                    }
                )
                .limit(100);


        if (error) {

            console.error(error);

            leaderboardList.innerHTML =
                "<p>Could not load leaderboard.</p>";

            return;

        }


        if (!data.length) {

            leaderboardList.innerHTML =
                "<p>No players yet.</p>";

            return;

        }


        leaderboardList.innerHTML = "";


        data.forEach(
            (
                player,
                index
            ) => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "leader-row";

                row.innerHTML =
                    `
                    <div class="rank">
                        ${index + 1}
                    </div>

                    <div class="nick">
                        ${escapeHtml(
                            player.username
                        )}
                    </div>

                    <div class="score">
                        ${Number(
                            player.clicks || 0
                        ).toLocaleString()}
                    </div>
                    `;

                leaderboardList.appendChild(
                    row
                );

            }
        );

    }
);

/* =========================
   CHANGE NICKNAME
========================= */

profileNicknameButton.addEventListener(
    "click",
    async () => {

        hide(profileOverlay);

        show(changeNicknameOverlay);

        changeNicknameInput.value = "";

        changeNicknameStatus.textContent =
            "";

        const {
            data,
            error
        } =
            await supabaseClient
                .from("leadboard")
                .select(
                    "nickname_changed_at"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


        if (
            error ||
            !data
        ) {

            cooldownText.textContent =
                "Nickname settings unavailable.";

            return;

        }


        if (
            !data.nickname_changed_at
        ) {

            cooldownText.textContent =
                "You can change your nickname.";

            return;

        }


        const lastChange =
            new Date(
                data.nickname_changed_at
            );

        const nextChange =
            new Date(
                lastChange.getTime() +
                30 *
                24 *
                60 *
                60 *
                1000
            );

        const now =
            new Date();


        if (
            now >= nextChange
        ) {

            cooldownText.textContent =
                "You can change your nickname.";

        } else {

            const days =
                Math.ceil(
                    (
                        nextChange -
                        now
                    ) /
                    (
                        24 *
                        60 *
                        60 *
                        1000
                    )
                );

            cooldownText.textContent =
                "You can change your nickname in " +
                days +
                " day(s).";

        }

    }
);

   AUTH CHECK
========================= */

async function checkAuth() {

    const {
        data
    } =
        await supabaseClient
            .auth
            .getUser();


    if (data.user) {

        currentUser =
            data.user;

        isGuest = false;

        hide(loginOverlay);

        await loadProfile();

    } else {

        show(loginOverlay);

    }


    await loadTodaysWinner();

}

   AUTH STATE
========================= */

supabaseClient.auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            if (session?.user) {

                currentUser =
                    session.user;

                isGuest = false;

                hide(loginOverlay);

                await loadProfile();

            }

        }
    );
