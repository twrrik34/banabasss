<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CLICK ME</title>

<link
    rel="icon"
    type="image/png"
    href="logo.png.png"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #10152c 0%,
            #050816 38%,
            #02030a 75%,
            #000106 100%
        );

    color: white;

    font-family:
        Arial,
        sans-serif;
}


/* =========================
   SPACE BACKGROUND
========================= */

.stars {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 0;

    overflow: hidden;
}


/* =========================
   NORMAL STAR
========================= */

.star {

    position: absolute;

    top: -20px;

    width: 2px;

    height: 2px;

    border-radius: 50%;

    background: white;

    opacity: .8;

    box-shadow:
        0 0 6px
        rgba(255,255,255,.9);

    animation:
        starFall
        linear
        infinite;

    will-change:
        transform;
}


/* =========================
   SMALL STAR
========================= */

.star.small {

    width: 1px;

    height: 1px;

    opacity: .45;

    box-shadow:
        0 0 3px
        rgba(255,255,255,.5);
}


/* =========================
   NORMAL STAR
========================= */

.star.normal {

    width: 2px;

    height: 2px;

    opacity: .8;

    box-shadow:
        0 0 7px
        rgba(255,255,255,.9);
}


/* =========================
   BRIGHT STAR
========================= */

.star.bright {

    width: 3px;

    height: 3px;

    opacity: 1;

    box-shadow:
        0 0 14px
        rgba(255,255,255,1);
}


/* =========================
   CROSS STAR
========================= */

.star.cross {

    width: 3px;

    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 5px white,
        0 -7px 5px rgba(255,255,255,.6),
        0 7px 5px rgba(255,255,255,.6),
        -7px 0 5px rgba(255,255,255,.6),
        7px 0 5px rgba(255,255,255,.6);
}


/* =========================
   DIAMOND STAR
========================= */

.star.diamond {

    width: 5px;

    height: 5px;

    border-radius: 0;

    transform: rotate(45deg);

    background: white;

    box-shadow:
        0 0 10px
        rgba(255,255,255,1);
}


/* =========================
   GLOW STAR
========================= */

.star.glow {

    width: 4px;

    height: 4px;

    background: white;

    box-shadow:
        0 0 5px white,
        0 0 14px white,
        0 0 24px
        rgba(255,255,255,.7);
}


/* =========================
   STAR FALL
========================= */

@keyframes starFall {

    from {

        transform:
            translateY(-12vh);

    }

    to {

        transform:
            translateY(112vh);

    }

}


/* =========================
   USER INFO
========================= */

.user-info {

    position: fixed;

    top: 18px;

    right: 18px;

    z-index: 5;

    padding: 10px 15px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size: 14px;

    cursor: pointer;
}


/* =========================
   MAIN
========================= */

.container {

    position: relative;

    z-index: 2;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 24px;
}


/* =========================
   COUNTER
========================= */

.counter {

    color: white;

    font-size: 26px;

    font-weight: 700;

    letter-spacing: 2px;

    text-shadow:
        0 0 10px
        rgba(255,255,255,.35);
}


/* =========================
   CLICK BUTTON
========================= */

.click-button {

    position: relative;

    width: 360px;

    height: 180px;

    border: none;

    border-radius: 30px;

    background:
        linear-gradient(
            to bottom,
            #ff3b3b,
            #d40000
        );

    color: white;

    font-size: 42px;

    font-weight: 900;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 18px 0 #8b0000,
        0 25px 35px
        rgba(0,0,0,.6);

    transition:
        transform .08s ease,
        box-shadow .08s ease;
}

.click-button:active {

    transform:
        translateY(18px);

    box-shadow:
        0 0 0 #8b0000,
        0 8px 20px
        rgba(0,0,0,.5);
}

.click-button::before {

    content: "";

    position: absolute;

    top: 10px;

    left: 12px;

    right: 12px;

    height: 35px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.18);

    pointer-events: none;
}


/* =========================
   LEADERBOARD BUTTON
========================= */

.leaderboard-button {

    padding: 12px 22px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.07);

    color: white;

    font-weight: 700;

    cursor: pointer;
}


/* =========================
   OVERLAY
========================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    opacity: 1;

    transition:
        opacity .25s ease;
}

.overlay.hidden {

    opacity: 0;

    pointer-events: none;
}


/* =========================
   MODAL
========================= */

.modal {

    width:
        min(92%, 420px);

    padding: 32px 26px;

    border-radius: 24px;

    background:
        rgba(15,17,30,.96);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.7);

    text-align: center;
}

.modal h1 {

    font-size: 30px;

    margin-bottom: 10px;
}

.modal p {

    color: #aaa;

    font-size: 14px;

    margin-bottom: 22px;
}


/* =========================
   INPUT
========================= */

.nickname-input {

    width: 100%;

    height: 52px;

    padding: 0 15px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.06);

    color: white;

    outline: none;

    font-size: 16px;

    text-align: center;
}


/* =========================
   BUTTONS
========================= */

.primary-button,
.secondary-button,
.google-button,
.guest-button {

    width: 100%;

    height: 52px;

    margin-top: 12px;

    border-radius: 12px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}

.primary-button {

    border: none;

    background:
        #ff3030;

    color: white;
}

.secondary-button {

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.05);

    color: white;
}

.google-button {

    border: none;

    background: white;

    color: #222;
}

.guest-button {

    border:
        1px solid
        rgba(255,255,255,.15);

    background: transparent;

    color: white;
}


/* =========================
   LEADERBOARD
========================= */

.leaderboard-list {

    max-height: 380px;

    overflow-y: auto;

    margin-top: 20px;
}

.leader-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 13px 10px;

    margin-bottom: 7px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.05);
}

.rank {

    width: 40px;

    font-weight: 900;
}

.nick {

    flex: 1;

    text-align: left;
}

.score {

    font-weight: 900;
}


/* =========================
   STATUS
========================= */

.status {

    min-height: 20px;

    margin-top: 15px;

    color: #aaa;

    font-size: 13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .click-button {

        width: 280px;

        height: 150px;

        font-size: 34px;
    }

    .counter {

        font-size: 22px;
    }

    .user-info {

        top: 10px;

        right: 10px;
    }

}


/* =========================
   SCRIPT
========================= */

</style>

</head>


<body>


<div class="stars"></div>


<div class="user-info" id="userInfo">
    Guest
</div>


<div class="container">

    <div
        class="counter"
        id="counter"
    >
        0 CLICKS
    </div>


    <button
        class="click-button"
        id="clickButton"
    >
        CLICK ME
    </button>


    <button
        class="leaderboard-button"
        id="leaderboardButton"
    >
        🏆 GLOBAL LEADERBOARD
    </button>

</div>


<!-- LOGIN -->

<div
    class="overlay"
    id="loginOverlay"
>

    <div class="modal">

        <h1>CLICK ME</h1>

        <p>
            Choose how you want to enter
        </p>


        <button
            class="google-button"
            id="googleButton"
        >
            🔵 Continue with Google
        </button>


        <button
            class="guest-button"
            id="guestButton"
        >
            👻 Continue as Guest
        </button>


        <div
            class="status"
            id="loginStatus"
        ></div>

    </div>

</div>


<!-- NICKNAME -->

<div
    class="overlay hidden"
    id="nicknameOverlay"
>

    <div class="modal">

        <h1>
            Choose your nickname
        </h1>

        <p>
            This is the name that will appear on the leaderboard.
        </p>


        <input
            class="nickname-input"
            id="nicknameInput"
            maxlength="20"
            placeholder="Your nickname"
        >


        <button
            class="primary-button"
            id="saveNicknameButton"
        >
            Continue
        </button>


        <div
            class="status"
            id="nicknameStatus"
        ></div>

    </div>

</div>


<!-- CHANGE NICKNAME -->

<div
    class="overlay hidden"
    id="changeNicknameOverlay"
>

    <div class="modal">

        <h1>
            Change nickname
        </h1>

        <p id="cooldownText">
            You can change your nickname here.
        </p>


        <input
            class="nickname-input"
            id="changeNicknameInput"
            maxlength="20"
            placeholder="New nickname"
        >


        <button
            class="primary-button"
            id="changeNicknameButton"
        >
            Change nickname
        </button>


        <button
            class="secondary-button"
            id="closeNicknameButton"
        >
            Cancel
        </button>


        <div
            class="status"
            id="changeNicknameStatus"
        ></div>

    </div>

</div>


<!-- LEADERBOARD -->

<div
    class="overlay hidden"
    id="leaderboardOverlay"
>

    <div class="modal">

        <h1>
            🏆 GLOBAL
        </h1>

        <p>
            Top clickers
        </p>


        <div
            class="leaderboard-list"
            id="leaderboardList"
        ></div>


        <button
            class="secondary-button"
            id="closeLeaderboardButton"
        >
            Close
        </button>

    </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://usvrsrodbivsjrxityzb.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_QUghnr59x4oH65LZqQW5zg_7qR7yMr4";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const loginOverlay =
    document.getElementById(
        "loginOverlay"
    );


const nicknameOverlay =
    document.getElementById(
        "nicknameOverlay"
    );


const changeNicknameOverlay =
    document.getElementById(
        "changeNicknameOverlay"
    );


const leaderboardOverlay =
    document.getElementById(
        "leaderboardOverlay"
    );


const googleButton =
    document.getElementById(
        "googleButton"
    );


const guestButton =
    document.getElementById(
        "guestButton"
    );


const clickButton =
    document.getElementById(
        "clickButton"
    );


const counter =
    document.getElementById(
        "counter"
    );


const userInfo =
    document.getElementById(
        "userInfo"
    );


const nicknameInput =
    document.getElementById(
        "nicknameInput"
    );


const saveNicknameButton =
    document.getElementById(
        "saveNicknameButton"
    );


const leaderboardButton =
    document.getElementById(
        "leaderboardButton"
    );


const leaderboardList =
    document.getElementById(
        "leaderboardList"
    );


const changeNicknameInput =
    document.getElementById(
        "changeNicknameInput"
    );


const changeNicknameButton =
    document.getElementById(
        "changeNicknameButton"
    );


const closeNicknameButton =
    document.getElementById(
        "closeNicknameButton"
    );


const closeLeaderboardButton =
    document.getElementById(
        "closeLeaderboardButton"
    );


const loginStatus =
    document.getElementById(
        "loginStatus"
    );


const nicknameStatus =
    document.getElementById(
        "nicknameStatus"
    );


const changeNicknameStatus =
    document.getElementById(
        "changeNicknameStatus"
    );


const cooldownText =
    document.getElementById(
        "cooldownText"
    );


/* =========================
   STATE
========================= */

let currentUser = null;

let isGuest = false;

let clicks = 0;

let currentNickname = null;


/* =========================
   SPACE STARS
========================= */

const stars =
    document.querySelector(
        ".stars"
    );


for(
    let i = 0;
    i < 180;
    i++
) {

    const star =
        document.createElement(
            "div"
        );


    star.classList.add(
        "star"
    );


    /* RANDOM POSITION */

    star.style.left =
        Math.random() * 100 +
        "%";


    /* RANDOM HEIGHT */

    star.style.top =
        Math.random() * 100 +
        "%";


    /*
        STAR TYPES

        0 - 55%  small
        55 - 82% normal
        82 - 90% bright
        90 - 95% cross
        95 - 98% diamond
        98 - 100% glow
    */

    const type =
        Math.random();


    if(type < .55) {

        star.classList.add(
            "small"
        );

    }

    else if(type < .82) {

        star.classList.add(
            "normal"
        );

    }

    else if(type < .90) {

        star.classList.add(
            "bright"
        );

    }

    else if(type < .95) {

        star.classList.add(
            "cross"
        );

    }

    else if(type < .98) {

        star.classList.add(
            "diamond"
        );

    }

    else {

        star.classList.add(
            "glow"
        );

    }


    /*
        RANDOM SPEED

        10 - 20 seconds
    */

    star.style.animationDuration =
        (
            Math.random() * 10 +
            10
        ) +
        "s";


    /*
        RANDOM START

        Makes the sky feel
        already alive.
    */

    star.style.animationDelay =
        (
            Math.random() * -20
        ) +
        "s";


    stars.appendChild(
        star
    );

}


/* =========================
   HELPERS
========================= */

function show(
    element
) {

    element.classList.remove(
        "hidden"
    );

}


function hide(
    element
) {

    element.classList.add(
        "hidden"
    );

}


function updateCounter() {

    counter.textContent =
        clicks +
        (
            clicks === 1
                ? " CLICK"
                : " CLICKS"
        );

}


/* =========================
   GOOGLE LOGIN
========================= */

googleButton.addEventListener(
    "click",
    async () => {

        loginStatus.textContent =
            "Opening Google...";


        const { error } =
            await supabaseClient.auth
                .signInWithOAuth({

                    provider:
                        "google",

                    options: {

                        redirectTo:
                            window.location.origin

                    }

                });


        if(error) {

            console.error(
                error
            );


            loginStatus.textContent =
                error.message;

        }

    }
);


/* =========================
   GUEST
========================= */

guestButton.addEventListener(
    "click",
    () => {

        isGuest =
            true;


        currentUser =
            null;


        currentNickname =
            null;


        userInfo.textContent =
            "👻 Guest";


        hide(
            loginOverlay
        );


        clicks =
            0;


        updateCounter();

    }
);


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

    if(!currentUser) {

        return;

    }


    const { data, error } =
        await supabaseClient
            .from("leadboard")
            .select(
                "username, clicks, nickname_changed_at"
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


    if(error) {

        console.error(
            error
        );

        return;

    }


    if(!data) {

        console.error(
            "Profile not found"
        );

        return;

    }


    currentNickname =
        data.username;


    clicks =
        data.clicks || 0;


    updateCounter();


    if(currentNickname) {

        userInfo.textContent =
            "👤 " +
            currentNickname;


        hide(
            nicknameOverlay
        );

    }

    else {

        show(
            nicknameOverlay
        );


        nicknameInput.focus();

    }

}


/* =========================
   SAVE FIRST NICKNAME
========================= */

saveNicknameButton.addEventListener(
    "click",
    async () => {

        const nickname =
            nicknameInput.value.trim();


        if(!nickname) {

            nicknameStatus.textContent =
                "Enter a nickname.";

            return;

        }


        nicknameStatus.textContent =
            "Saving...";


        const { data, error } =
            await supabaseClient
                .rpc(
                    "change_nickname",
                    {
                        new_nickname:
                            nickname
                    }
                );


        if(error) {

            nicknameStatus.textContent =
                error.message;

            return;

        }


        currentNickname =
            data;


        userInfo.textContent =
            "👤 " +
            currentNickname;


        hide(
            nicknameOverlay
        );


        nicknameStatus.textContent =
            "";

    }
);


/* =========================
   CLICK
========================= */

clickButton.addEventListener(
    "click",
    async () => {

        if(isGuest) {

            clicks++;

            updateCounter();

            return;

        }


        if(!currentUser) {

            show(
                loginOverlay
            );

            return;

        }


        const { data, error } =
            await supabaseClient
                .rpc(
                    "increment_clicks"
                );


        if(error) {

            console.error(
                error
            );

            return;

        }


        clicks =
            data;


        updateCounter();

    }
);


/* =========================
   LEADERBOARD
========================= */

leaderboardButton.addEventListener(
    "click",
    async () => {

        show(
            leaderboardOverlay
        );


        leaderboardList.innerHTML =
            "<p>Loading...</p>";


        const { data, error } =
            await supabaseClient
                .from("leadboard")
                .select(
                    "username, clicks"
                )
                .not(
                    "username",
                    "is",
                    null
                )
                .order(
                    "clicks",
                    {
                        ascending:
                            false
                    }
                )
                .limit(
                    100
                );


        if(error) {

            console.error(
                error
            );


            leaderboardList.innerHTML =
                "<p>Could not load leaderboard.</p>";


            return;

        }


        if(!data.length) {

            leaderboardList.innerHTML =
                "<p>No players yet.</p>";


            return;

        }


        leaderboardList.innerHTML =
            "";


        data.forEach(
            (
                player,
                index
            ) => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "leader-row";


                row.innerHTML = `

                    <div class="rank">
                        ${index + 1}
                    </div>

                    <div class="nick">
                        ${escapeHtml(
                            player.username
                        )}
                    </div>

                    <div class="score">
                        ${Number(
                            player.clicks || 0
                        ).toLocaleString()}
                    </div>

                `;


                leaderboardList.appendChild(
                    row
                );

            }
        );

    }
);


/* =========================
   CHANGE NICKNAME
========================= */

userInfo.addEventListener(
    "click",
    async () => {

        if(
            !currentUser ||
            !currentNickname
        ) {

            return;

        }


        show(
            changeNicknameOverlay
        );


        changeNicknameInput.value =
            "";


        changeNicknameStatus.textContent =
            "";


        const { data, error } =
            await supabaseClient
                .from("leadboard")
                .select(
                    "nickname_changed_at"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


        if(
            error ||
            !data
        ) {

            cooldownText.textContent =
                "Nickname settings unavailable.";

            return;

        }


        if(
            !data.nickname_changed_at
        ) {

            cooldownText.textContent =
                "You can change your nickname.";

            return;

        }


        const lastChange =
            new Date(
                data.nickname_changed_at
            );


        const nextChange =
            new Date(
                lastChange.getTime() +
                30 *
                24 *
                60 *
                60 *
                1000
            );


        const now =
            new Date();


        if(
            now >= nextChange
        ) {

            cooldownText.textContent =
                "You can change your nickname.";

        }

        else {

            const days =
                Math.ceil(
                    (
                        nextChange -
                        now
                    ) /
                    (
                        24 *
                        60 *
                        60 *
                        1000
                    )
                );


            cooldownText.textContent =
                "You can change your nickname in " +
                days +
                " day(s).";

        }

    }
);


/* =========================
   CHANGE NICKNAME BUTTON
========================= */

changeNicknameButton.addEventListener(
    "click",
    async () => {

        const nickname =
            changeNicknameInput.value.trim();


        if(!nickname) {

            changeNicknameStatus.textContent =
                "Enter a nickname.";

            return;

        }


        changeNicknameStatus.textContent =
            "Saving...";


        const { data, error } =
            await supabaseClient
                .rpc(
                    "change_nickname",
                    {
                        new_nickname:
                            nickname
                    }
                );


        if(error) {

            changeNicknameStatus.textContent =
                error.message;

            return;

        }


        currentNickname =
            data;


        userInfo.textContent =
            "👤 " +
            currentNickname;


        hide(
            changeNicknameOverlay
        );

    }
);


/* =========================
   CLOSE BUTTONS
========================= */

closeNicknameButton.addEventListener(
    "click",
    () => {

        hide(
            changeNicknameOverlay
        );

    }
);


closeLeaderboardButton.addEventListener(
    "click",
    () => {

        hide(
            leaderboardOverlay
        );

    }
);


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================
   AUTH CHECK
========================= */

async function checkAuth() {

    const { data } =
        await supabaseClient.auth
            .getUser();


    if(data.user) {

        currentUser =
            data.user;


        isGuest =
            false;


        hide(
            loginOverlay
        );


        await loadProfile();

    }

    else {

        show(
            loginOverlay
        );

    }

}


/* =========================
   AUTH EVENTS
========================= */

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        if(session?.user) {

            currentUser =
                session.user;


            isGuest =
                false;


            hide(
                loginOverlay
            );


            await loadProfile();

        }

    }
);


/* =========================
   START
========================= */

checkAuth();

</script>
