<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>banabasss</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: #02030a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Uzay yıldızları */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        /* Ana içerik */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Sayaç */
        .counter {
            color: white;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
        }

        /* Ana buton */
        .click-button {
            position: relative;

            width: 360px;
            height: 180px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(
                to bottom,
                #ff3b3b,
                #d40000
            );

            color: white;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 18px 0 #8b0000,
                0 25px 35px rgba(0, 0, 0, 0.6);

            transition:
                transform 0.08s ease,
                box-shadow 0.08s ease;
        }

        /* Butona basınca fiziksel olarak çöker */
        .click-button:active {
            transform: translateY(18px);

            box-shadow:
                0 0 0 #8b0000,
                0 8px 20px rgba(0, 0, 0, 0.5);
        }

        /* Butonun üstündeki hafif parlama */
        .click-button::before {
            content: "";

            position: absolute;

            top: 10px;
            left: 12px;
            right: 12px;
            height: 35px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.18);

            pointer-events: none;
        }

        /* Telefon */
        @media (max-width: 600px) {
            .click-button {
                width: 280px;
                height: 150px;
                font-size: 34px;
            }

            .counter {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- Yıldızlar -->
    <div class="stars"></div>

    <!-- Ana içerik -->
    <div class="container">

        <div class="counter">
            0 CLICKS
        </div>

        <button class="click-button">
            CLICK ME
        </button>

    </div>

    <script>

        /* =========================
           YILDIZLARI OLUŞTUR
        ========================= */

        const starsContainer = document.querySelector(".stars");

        for (let i = 0; i < 150; i++) {

            const star = document.createElement("div");

            star.classList.add("star");

            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";

            const size = Math.random() * 3 + 1;

            star.style.width = size + "px";
            star.style.height = size + "px";

            starsContainer.appendChild(star);
        }


        /* =========================
           CLICK SAYACI
        ========================= */

        const button = document.querySelector(".click-button");
        const counter = document.querySelector(".counter");

        let clicks = 0;

        button.addEventListener("click", function () {

            clicks++;

            counter.textContent =
                clicks + (clicks === 1 ? " CLICK" : " CLICKS");

        });

    </script>

</body>
</html>
